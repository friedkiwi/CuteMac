name: Windows Win64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    # Qt, libslirp, and glib are built from source by vcpkg. A warm shared
    # binary cache makes this quick; a cold one has to build Qt, which can
    # approach the six-hour ceiling GitHub imposes on a job. The cache is
    # readwrite and each package uploads as it finishes, so a run that times
    # out still leaves its work behind: re-run the workflow and it resumes
    # from wherever the cache now covers.
    timeout-minutes: 360

    env:
      VCPKG_BINARY_SOURCES: "clear;http,http://buildcache.cyber.gent/ac/{sha},readwrite"
      # Must match VCPKG_TARGET_TRIPLET in the windows-msvc-ci preset; the
      # packaging step reads the installed tree by that name.
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify IPv6 connectivity
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Output "=== IPv6 Connectivity Diagnostics ==="
          $ipv6LocalAvailable = $false
          $ipv6DnsWorks = $false
          $ipv6ExternalWorks = $false

          # Check local IPv6 interfaces
          try {
            $ipv6Addresses = [System.Net.NetworkInformation.NetworkInterface]::GetAllNetworkInterfaces() |
              ForEach-Object {
                $_.GetIPProperties().UnicastAddresses |
                Where-Object { $_.Address.AddressFamily -eq "InterNetworkV6" }
              }

            if ($ipv6Addresses.Count -gt 0) {
              $ipv6LocalAvailable = $true
              Write-Output "[✓] IPv6 local interfaces: $(($ipv6Addresses | Measure-Object).Count) address(es)"
              $ipv6Addresses | ForEach-Object { Write-Output "    - $($_.Address)" }
            } else {
              Write-Output "[✗] No IPv6 addresses found on network interfaces"
            }
          } catch {
            Write-Output "[✗] Error checking IPv6 interfaces: $_"
          }

          # Try to resolve an IPv6 address
          try {
            $result = Resolve-DnsName -Name "ipv6.google.com" -Type AAAA -ErrorAction SilentlyContinue
            if ($result) {
              $ipv6DnsWorks = $true
              Write-Output "[✓] IPv6 DNS resolution works: $($result.IPAddress)"
            } else {
              Write-Output "[✗] IPv6 DNS resolution failed or not available"
            }
          } catch {
            Write-Output "[✗] IPv6 DNS check exception: $_"
          }

          # Test external IPv6 connectivity with curl
          try {
            Write-Output "`n[*] Testing external IPv6 connectivity via ifconfig.me..."
            $curlResult = curl.exe -6 -s -m 5 "https://ifconfig.me" 2>$null
            if ($LASTEXITCODE -eq 0 -and $curlResult) {
              $ipv6ExternalWorks = $true
              Write-Output "[✓] External IPv6 works. Public IPv6 address: $curlResult"
            } else {
              Write-Output "[✗] curl to ifconfig.me failed (exit code: $LASTEXITCODE)"
            }
          } catch {
            Write-Output "[✗] Exception during IPv6 connectivity test: $_"
          }

          # Summary
          Write-Output "`n=== Summary ==="
          Write-Output "Local IPv6 interfaces: $(if ($ipv6LocalAvailable) { '✓' } else { '✗' })"
          Write-Output "IPv6 DNS resolution: $(if ($ipv6DnsWorks) { '✓' } else { '✗' })"
          Write-Output "External IPv6 connectivity: $(if ($ipv6ExternalWorks) { '✓' } else { '✗' })"
          Write-Output "This is diagnostic information only and will not affect the build."

      - name: Create short build path
        shell: pwsh
        run: |
          # cl.exe is not long-path aware and fails with C1083 on any output past
          # MAX_PATH. Two independent shortenings guard against that:
          #
          #   1. subst V: for the workspace, so the build tree and vcpkg_installed
          #      are reached through a two-character prefix.
          #   2. A scratch root on the workspace drive for vcpkg's buildtrees and
          #      packages. vcpkg canonicalises the paths it is given, so the subst
          #      alone does not shorten them -- and Qt's object paths under
          #      buildtrees are the ones that actually cross 260 characters.
          # Not Join-Path: given a bare qualifier it can produce the
          # drive-relative "D:cutemac-vcpkg" rather than "D:\cutemac-vcpkg".
          $scratch = "$(Split-Path -Qualifier $env:GITHUB_WORKSPACE)\cutemac-vcpkg"
          New-Item -ItemType Directory -Force -Path "$scratch\bt", "$scratch\pkg" | Out-Null
          echo "CUTEMAC_VCPKG_SCRATCH=$scratch" >> $env:GITHUB_ENV

          subst V: $env:GITHUB_WORKSPACE
          # Export a shorter GITHUB_WORKSPACE for subsequent steps
          echo "GITHUB_WORKSPACE=V:\\" >> $env:GITHUB_ENV
          # Also set VCPKG_ROOT to use short path
          echo "VCPKG_ROOT=V:\third_party\vcpkg" >> $env:GITHUB_ENV
          # Verify the mapping worked
          Write-Output "Path mapping: V:\ -> $(subst list | Select-String 'V:')"
          Write-Output "GITHUB_WORKSPACE set to: V:\\"
          Write-Output "vcpkg scratch root: $scratch"

      - name: Bootstrap vendored vcpkg
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          ./third_party/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      # Installing the manifest as its own step keeps the multi-hour cold-cache
      # dependency build off the configure step, where CMake buffers vcpkg's
      # output and the log only appears once it is over. The flags match what
      # the toolchain file would pass, so the install below is a no-op.
      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          ./third_party/vcpkg/vcpkg.exe install `
            --triplet $env:VCPKG_TRIPLET `
            --host-triplet $env:VCPKG_TRIPLET `
            --x-manifest-root=. `
            --x-install-root=build/vcpkg_installed `
            --x-buildtrees-root=$env:CUTEMAC_VCPKG_SCRATCH/bt `
            --x-packages-root=$env:CUTEMAC_VCPKG_SCRATCH/pkg 2>&1 | Tee-Object -FilePath build/vcpkg-install.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          cmake --preset windows-msvc-ci 2>&1 | Tee-Object -FilePath build/cmake-configure.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          & cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = Get-Content build-output.log -Tail 200
            Add-Content $env:GITHUB_STEP_SUMMARY "### Windows build failure"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'

            $annotation = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$annotation"

            # Save full build log for inspection
            New-Item -ItemType Directory -Path build-diagnostics -Force | Out-Null
            Copy-Item build-output.log -Destination build-diagnostics/build-full.log

            exit $buildExitCode
          }

      - name: Test
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Assemble portable folder
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $package = Join-Path $env:GITHUB_WORKSPACE "package/CuteMac-win64"
          cmake --install build --config Release --prefix $package --component Runtime

          $productExecutables = @("CuteMac.exe")
          $unexpectedExecutables = Get-ChildItem $package -Filter *.exe -File -Recurse |
            Where-Object { $_.Name -notin $productExecutables }
          if ($unexpectedExecutables) {
            throw "Runtime install contains non-product executables: $($unexpectedExecutables.Name -join ', ')"
          }

          # Qt now comes from the vcpkg manifest, so its tools live in the
          # per-build installed tree rather than on PATH. Let windeployqt
          # classify the binary itself instead of forcing --release.
          $vcpkgInstalled = Join-Path $env:GITHUB_WORKSPACE "build/vcpkg_installed/$env:VCPKG_TRIPLET"
          $windeployqt = Join-Path $vcpkgInstalled "tools/Qt6/bin/windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt was not found at $windeployqt"
          }
          & $windeployqt --no-translations --compiler-runtime --dir $package "$package/CuteMac.exe"

          # Non-Qt runtime DLLs (libslirp, glib and its dependencies) are not
          # windeployqt's responsibility.
          $vcpkgBin = Join-Path $vcpkgInstalled "bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter *.dll | Copy-Item -Destination $package -Force
          }

          # Npcap is not open source and may not be redistributed without a
          # licence from the Nmap Project. CuteMac delay-loads the copy the user
          # installed, so its runtime must never reach an artifact; the npcap-sdk
          # port installs import libraries only, and this check keeps it that way.
          $npcapRuntime = Get-ChildItem $package -Filter *.dll |
            Where-Object { $_.Name -in @('wpcap.dll', 'Packet.dll', 'npcap.dll', 'NPFInstall.exe') }
          if ($npcapRuntime) {
            throw "Npcap runtime must never be redistributed: $($npcapRuntime.Name -join ', ')"
          }

      - name: Upload portable Win64 package
        uses: actions/upload-artifact@v4
        with:
          name: CuteMac-win64
          path: package/CuteMac-win64
          if-no-files-found: error
          retention-days: 14

      # Remove fuzzing artifacts to avoid EPERM during cleanup
      - name: Remove fuzzing artifacts to avoid EPERM during cleanup
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem "$env:CUTEMAC_VCPKG_SCRATCH\bt" -Recurse -Force -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\fuzzing($|\\)' } |
            ForEach-Object { Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue }

      # A dependency that fails to build reports only a path to a log inside
      # buildtrees, which is discarded with the runner. Collect them so a
      # failed run is diagnosable without reproducing a multi-hour build.
      # buildtrees now lives outside the workspace, and upload-artifact only
      # takes workspace-relative paths, so stage the logs first.
      - name: Collect vcpkg logs
        if: failure()
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force -Path vcpkg-logs | Out-Null
          $bt = "$env:CUTEMAC_VCPKG_SCRATCH\bt"
          if (Test-Path $bt) {
            Get-ChildItem $bt -Recurse -Filter *.log -ErrorAction SilentlyContinue |
              # CMakeConfigureLog.yaml.log alone runs to ~130 MB per config and
              # says nothing about a compile failure.
              Where-Object { $_.Length -lt 20MB } |
              ForEach-Object {
                # Flatten <package>/<log>.log so names stay unique and short.
                $relative = $_.FullName.Substring($bt.Length).TrimStart('\', '/').Replace('\', '_').Replace('/', '_')
                Copy-Item $_.FullName -Destination "vcpkg-logs/$relative" -Force -ErrorAction SilentlyContinue
              }
          }

      - name: Upload vcpkg logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: |
            build/vcpkg-manifest-install.log
            vcpkg-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build-diagnostics/
            build-output.log
            build/vcpkg-install.log
            build/cmake-configure.log
            build/.cmake/api/v1/reply/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload CMake configure output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove subst mapping
        if: always()
        shell: pwsh
        run: |
          subst V: /D || echo "V: not mapped"
