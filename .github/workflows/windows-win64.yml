name: Windows Win64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    # Qt, libslirp, and glib are built from source by vcpkg. A warm shared
    # binary cache makes this quick; a cold one has to build Qt.
    timeout-minutes: 360

    env:
      VCPKG_BINARY_SOURCES: "clear;http,http://buildcache.cyber.gent/ac/{sha},readwrite"

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Bootstrap vendored vcpkg
        shell: pwsh
        run: ./third_party/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        shell: pwsh
        run: cmake --preset windows-msvc-ci

      - name: Build
        shell: pwsh
        run: |
          & cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = Get-Content build-output.log -Tail 200
            Add-Content $env:GITHUB_STEP_SUMMARY "### Windows build failure"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'

            $annotation = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$annotation"
            exit $buildExitCode
          }

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package/CuteMac-win64"
          cmake --install build --config Release --prefix $package --component Runtime

          $productExecutables = @("CuteMac.exe")
          $unexpectedExecutables = Get-ChildItem $package -Filter *.exe -File -Recurse |
            Where-Object { $_.Name -notin $productExecutables }
          if ($unexpectedExecutables) {
            throw "Runtime install contains non-product executables: $($unexpectedExecutables.Name -join ', ')"
          }

          # Qt now comes from the vcpkg manifest, so its tools live in the
          # per-build installed tree rather than on PATH. Let windeployqt
          # classify the binary itself instead of forcing --release.
          $vcpkgInstalled = Join-Path $env:GITHUB_WORKSPACE "build/vcpkg_installed/x64-windows"
          $windeployqt = Join-Path $vcpkgInstalled "tools/Qt6/bin/windeployqt.exe"
          if (-not (Test-Path $windeployqt)) {
            throw "windeployqt was not found at $windeployqt"
          }
          & $windeployqt --no-translations --compiler-runtime --dir $package "$package/CuteMac.exe"

          # Non-Qt runtime DLLs (libslirp, glib and its dependencies) are not
          # windeployqt's responsibility.
          $vcpkgBin = Join-Path $vcpkgInstalled "bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter *.dll | Copy-Item -Destination $package -Force
          }

      - name: Upload portable Win64 package
        uses: actions/upload-artifact@v4
        with:
          name: CuteMac-win64
          path: package/CuteMac-win64
          if-no-files-found: error
          retention-days: 14
