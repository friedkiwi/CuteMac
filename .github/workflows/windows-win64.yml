name: Windows Win64

on:
  push:

permissions:
  contents: read

concurrency:
  group: windows-win64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true

      - name: Install toml++
        shell: pwsh
        run: vcpkg install tomlplusplus:x64-windows

      - name: Configure
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTING=ON

      - name: Build
        shell: pwsh
        run: |
          & cmake --build build --config Release 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $tail = Get-Content build-output.log -Tail 200
            Add-Content $env:GITHUB_STEP_SUMMARY "### Windows build failure"
            Add-Content $env:GITHUB_STEP_SUMMARY '```text'
            $tail | Add-Content $env:GITHUB_STEP_SUMMARY
            Add-Content $env:GITHUB_STEP_SUMMARY '```'

            $annotation = ($tail -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows build failed::$annotation"
            exit $buildExitCode
          }

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package/CuteMac-win64"
          cmake --install build --config Release --prefix $package --component Runtime

          $productExecutables = @("CuteMac.exe", "CuteMacSession.exe")
          $unexpectedExecutables = Get-ChildItem $package -Filter *.exe -File -Recurse |
            Where-Object { $_.Name -notin $productExecutables }
          if ($unexpectedExecutables) {
            throw "Runtime install contains non-product executables: $($unexpectedExecutables.Name -join ', ')"
          }

          windeployqt --release --no-translations --compiler-runtime --dir $package "$package/CuteMac.exe"
          windeployqt --release --no-translations --compiler-runtime --dir $package "$package/CuteMacSession.exe"

          $vcpkgBin = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Get-ChildItem $vcpkgBin -Filter *.dll | Copy-Item -Destination $package
          }

      - name: Upload portable Win64 package
        uses: actions/upload-artifact@v4
        with:
          name: CuteMac-win64
          path: package/CuteMac-win64
          if-no-files-found: error
          retention-days: 14
